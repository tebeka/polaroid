<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -10 552 630" width="552" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5F87"/>
      <stop offset="1" stop-color="#7D56F4"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3D9B8"/>
      <stop offset="1" stop-color="#D9A877"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="pearl" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#6B4A3A"/>
      <stop offset="1" stop-color="#2A1A14"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="photo">
      <rect x="56" y="56" width="400" height="400" rx="6"/>
    </clipPath>
    <clipPath id="cup">
      <path d="M176 196 L336 196 L318 420 Q316 432 304 432 L208 432 Q196 432 194 420 Z"/>
    </clipPath>
  </defs>

  <!-- the print -->
  <g transform="rotate(-3 256 300)" filter="url(#shadow)">
    <rect x="28" y="28" width="456" height="544" rx="14" fill="#FBF8F1"/>

    <!-- the photo -->
    <g clip-path="url(#photo)">
      <rect x="56" y="56" width="400" height="400" fill="url(#sky)"/>

      <!-- background bubbles -->
      <g fill="#FFFFFF">
        <circle cx="104" cy="112" r="22" fill-opacity="0.18"/>
        <circle cx="402" cy="138" r="30" fill-opacity="0.15"/>
        <circle cx="96" cy="330" r="14" fill-opacity="0.22"/>
        <circle cx="420" cy="380" r="18" fill-opacity="0.2"/>
        <circle cx="140" cy="200" r="7" fill-opacity="0.35"/>
        <circle cx="372" cy="250" r="9" fill-opacity="0.3"/>
        <circle cx="388" cy="92" r="5" fill-opacity="0.45"/>
        <circle cx="120" cy="420" r="6" fill-opacity="0.4"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.5">
        <circle cx="84" cy="256" r="10"/>
        <circle cx="430" cy="300" r="12"/>
        <circle cx="160" cy="96" r="8"/>
      </g>

      <!-- straw -->
      <rect x="268" y="96" width="22" height="200" rx="6" fill="#FF5F87" transform="rotate(12 279 196)"/>
      <rect x="272" y="96" width="5" height="200" rx="2" fill="#FFFFFF" fill-opacity="0.45" transform="rotate(12 279 196)"/>

      <!-- cup -->
      <g clip-path="url(#cup)">
        <rect x="160" y="196" width="200" height="240" fill="#FFFFFF" fill-opacity="0.35"/>
        <path d="M160 236 Q208 226 256 236 T352 236 L352 440 L160 440 Z" fill="url(#tea)"/>
        <rect x="268" y="96" width="22" height="330" rx="6" fill="#FF5F87" fill-opacity="0.55" transform="rotate(12 279 196)"/>
        <g fill="url(#pearl)">
          <circle cx="214" cy="410" r="14"/>
          <circle cx="244" cy="414" r="14"/>
          <circle cx="274" cy="410" r="14"/>
          <circle cx="302" cy="404" r="13"/>
          <circle cx="228" cy="386" r="13"/>
          <circle cx="258" cy="388" r="14"/>
          <circle cx="288" cy="382" r="13"/>
          <circle cx="242" cy="362" r="12"/>
          <circle cx="272" cy="358" r="12"/>
        </g>
        <g fill="#FFFFFF" fill-opacity="0.55">
          <circle cx="209" cy="405" r="3.5"/>
          <circle cx="239" cy="409" r="3.5"/>
          <circle cx="269" cy="405" r="3.5"/>
          <circle cx="297" cy="399" r="3.2"/>
          <circle cx="223" cy="381" r="3.2"/>
          <circle cx="253" cy="383" r="3.5"/>
          <circle cx="283" cy="377" r="3.2"/>
          <circle cx="237" cy="358" r="3"/>
          <circle cx="267" cy="354" r="3"/>
        </g>
        <rect x="160" y="196" width="200" height="240" fill="url(#glass)"/>
      </g>
      <path d="M176 196 L336 196 L318 420 Q316 432 304 432 L208 432 Q196 432 194 420 Z"
            fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.85"/>
      <!-- lid -->
      <rect x="166" y="184" width="180" height="16" rx="8" fill="#FFFFFF"/>
      <!-- glass highlight -->
      <path d="M194 214 L206 400" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-opacity="0.6"/>
    </g>

    <!-- name on the bottom strip -->
    <text x="256" y="530" text-anchor="middle" font-family="Fira Sans, DejaVu Sans, sans-serif"
          font-size="54" font-weight="600" letter-spacing="2" fill="#3A3346">polaroid</text>
  </g>
</svg>
